<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Stacja Pogodowa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sprawdź pogodę</h1>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Wpisz nazwę miejscowości...">
            <button id="get-weather-btn">Pogoda</button>
        </div>
        <div id="weather-results">
            <div id="current-weather"></div>
            <div id="forecast"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
